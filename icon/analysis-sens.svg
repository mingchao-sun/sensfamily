  <!-- axes: strength of the confounder with the treatment (right) and with the outcome (up) -->
  <path d="M6 3 L6 40 L71 40" fill="none" stroke="#9a9a9a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- contours of the adjusted estimate; the thick orange one is where the conclusion changes -->
  <path d="M11 6 Q16 34 66 37" fill="none" stroke="#e6ac40" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M28 5 Q34 21 69 24" fill="none" stroke="#6b9de8" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M45 4 Q50 11 69 12.5" fill="none" stroke="#6b9de8" stroke-width="2.2" stroke-linecap="round"/>
  <!-- benchmark covariate: the confounder would have to be stronger than this to matter -->
  <circle cx="14.5" cy="31" r="3.4" fill="#ffffff" stroke="#e6ac40" stroke-width="2.4"/>
</svg>
