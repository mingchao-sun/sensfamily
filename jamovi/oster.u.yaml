title: Coefficient Stability (Oster)
name: oster
jus: '3.0'
stage: 0
compilerMode: tame
children:
    - type: VariableSupplier
      persistentItems: false
      stretchFactor: 1
      children:
          - type: TargetLayoutBox
            label: Outcome
            children:
                - type: VariablesListBox
                  name: outcome
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Treatment
            children:
                - type: VariablesListBox
                  name: treat
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Controls
            children:
                - type: VariablesListBox
                  name: covs
                  isTarget: true
                  height: small
    - type: CollapseBox
      label: Assumptions
      collapsed: true
      children:
          - type: ComboBox
            name: rmaxType
          - type: TextBox
            name: rmax
            label: Rmax (multiple or value)
            format: number
          - type: TextBox
            name: delta
            label: Delta
            format: number
          - type: TextBox
            name: beta0
            label: Target value of the treatment coefficient
            format: number
    - type: CollapseBox
      label: Plot
      collapsed: true
      children:
          - type: CheckBox
            name: plot
    - type: CollapseBox
      label: Output
      collapsed: true
      children:
          - type: CheckBox
            name: showHelp
            label: Method notes
          - type: CheckBox
            name: showGuide
            label: Data and setup guide
