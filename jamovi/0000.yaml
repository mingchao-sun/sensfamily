    category: analyses
  - name: oster
    title: Coefficient Stability (Oster)
    menuGroup: Sensitivity
    menuSubgroup: Regression
    menuTitle: Coefficient Stability
    menuSubtitle: Selection on unobservables (Oster)
    ns: sensfamily
    category: analyses
usesNative: true
