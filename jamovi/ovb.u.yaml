title: Omitted Variable Bias (Robustness Value)
name: ovb
jus: '3.0'
stage: 0
compilerMode: tame
children:
    - type: VariableSupplier
      persistentItems: false
      stretchFactor: 1
      children:
          - type: TargetLayoutBox
            label: Outcome
            children:
                - type: VariablesListBox
                  name: outcome
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Treatment
            children:
                - type: VariablesListBox
                  name: treat
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Covariates
            children:
                - type: VariablesListBox
                  name: covs
                  isTarget: true
                  height: small
          - type: TargetLayoutBox
            label: Benchmark covariates
            children:
                - type: VariablesListBox
                  name: bench
                  isTarget: true
                  height: small
    - type: CollapseBox
      label: Sensitivity
      collapsed: true
      children:
          - type: TextBox
            name: q
            label: Reduce the estimate by (%)
            format: number
          - type: ComboBox
            name: direction
          - type: TextBox
            name: kd
            label: Multiples of the benchmark strength
            format: string
          - type: TextBox
            name: h0
            label: Null value of the treatment effect
            format: number
          - type: TextBox
            name: level
            label: Confidence level (%)
            format: number
    - type: CollapseBox
      label: Plot
      collapsed: true
      children:
          - type: CheckBox
            name: plot
          - type: ComboBox
            name: plotStat
          - type: TextBox
            name: plotLim
            label: Largest partial R2 on the axes
            format: number
    - type: CollapseBox
      label: Output
      collapsed: true
      children:
          - type: CheckBox
            name: showHelp
            label: Method notes
          - type: CheckBox
            name: showGuide
            label: Data and setup guide
